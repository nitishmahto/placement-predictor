<!DOCTYPE html>
<html>

<head>
<title>Placement Predictor</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<h1>AI Placement Predictor</h1>

<form action="/predict" method="post">

<label>CGPA</label>
<input type="number" step="0.1" name="cgpa"required>

<label>Skills</label>
<input type="number" name="skills"required>

<label>Projects</label>
<input type="number" name="projects"required>

<label>Internships</label>
<input type="number" name="internships"required>

<button type="submit">Predict</button>

</form>
<h2>Upload Resume</h2>

<form action="/analyze_resume" method="post" enctype="multipart/form-data">
    <input type="file" name="resume" accept=".pdf" required>
    <button type="submit">Analyze Resume</button>
</form>

<h2>{{ prediction_text }}</h2>

</body>
</html>
